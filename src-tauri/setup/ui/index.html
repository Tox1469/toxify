<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Toxify</title>
<style>
  :root {
    --bg: #121212;
    --elev: #1c1c1e;
    --elev2: #282829;
    --line: rgba(255, 255, 255, 0.1);
    --text: #fff;
    --muted: #b3b3b3;
    --dim: #8a8a8f;
    --accent: #8b7cf6;
    --accent-hi: #a397f9;
    --on-accent: #0b0b0c;
    --warn: #e3a447;
    --danger: #f07167;
    color-scheme: dark;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); user-select: none; cursor: default; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, .check:focus-within .box { outline: 2px solid var(--accent-hi); outline-offset: 2px; }

  header { height: 44px; flex: none; display: flex; align-items: center; padding-left: 20px; }
  header .name { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); pointer-events: none; }
  header .ctl { margin-left: auto; display: flex; height: 100%; }
  header .ctl button { width: 46px; height: 100%; display: grid; place-items: center; color: var(--muted); transition: background .12s, color .12s; }
  header .ctl button:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
  header .ctl button.close:hover { background: #c42b1c; color: #fff; }
  header .ctl button:disabled { opacity: .3; pointer-events: none; }

  #stage { display: block; width: 100%; height: 138px; flex: none; }
  #stage * { pointer-events: none; }
  #stage path { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.2, .7, .2, 1); }
  #stage .out { stroke: var(--accent); stroke-opacity: .32; }
  #stage .in { stroke: var(--accent); }
  #stage.live path { transition: none; }
  #head { fill: #fff; opacity: 0; transition: opacity .3s; }
  #stage.playing #head, #stage.live #head { opacity: 1; }

  main { flex: 1; padding: 6px 48px 0; display: flex; flex-direction: column; animation: rise .5s .15s both cubic-bezier(.2, .7, .2, 1); }
  h1 { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 8px; }
  .sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 470px; }
  .meta { margin: 14px 0 0; color: var(--dim); font-size: 12.5px; }
  .meta.warn { color: var(--warn); }
  .err { user-select: text; cursor: text; }

  label.title { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 4px 0 8px; }
  .path-row { display: flex; gap: 10px; align-items: center; }
  .path { flex: 1; min-width: 0; height: 38px; line-height: 38px; padding: 0 12px; background: var(--elev2); border-radius: 6px; color: var(--text); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .check { display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--text); cursor: pointer; }
  .check input { position: absolute; opacity: 0; width: 0; height: 0; }
  .check .box { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--dim); display: grid; place-items: center; transition: background .12s, border-color .12s; flex: none; }
  .check .box svg { opacity: 0; transition: opacity .12s; }
  .check input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .check input:checked + .box svg { opacity: 1; }
  .check:hover .box { border-color: var(--text); }
  .check input:checked:hover + .box { border-color: var(--accent-hi); background: var(--accent-hi); }

  footer { height: 88px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 48px; }
  footer .right { margin-left: auto; display: flex; gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 24px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .35); font-weight: 600; white-space: nowrap; transition: transform .12s, background .12s, border-color .12s; }
  .btn:hover { border-color: #fff; transform: scale(1.03); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 128px; }
  .btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
  .btn.small { height: 38px; padding: 0 18px; }
  .link { color: var(--muted); font-weight: 600; font-size: 13px; padding: 8px 0; }
  .link:hover { color: var(--text); }
  .pct { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; font-weight: 600; min-width: 128px; text-align: right; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header data-tauri-drag-region>
    <span class="name">
      <svg width="16" height="16" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="232" fill="#8b7cf6"/><path d="M220 700 C 430 700, 594 324, 804 324" stroke="#0b0b0c" stroke-opacity=".45" stroke-width="92" fill="none" stroke-linecap="round"/><path d="M220 324 C 430 324, 594 700, 804 700" stroke="#0b0b0c" stroke-width="92" fill="none" stroke-linecap="round"/></svg>
      Toxify
    </span>
    <div class="ctl">
      <button id="min" aria-label="Minimizar"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
      <button id="close" class="close" aria-label="Fechar"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg></button>
    </div>
  </header>

  <!-- As duas curvas do logo: uma música saindo, outra entrando. Durante a instalação, viram a barra de progresso. -->
  <svg id="stage" viewBox="0 0 600 138" data-tauri-drag-region aria-hidden="true">
    <path class="out" d="M48 24 C 228 24, 372 114, 552 114" />
    <path class="in" d="M48 114 C 228 114, 372 24, 552 24" />
    <circle id="head" r="5" cx="48" cy="114" />
  </svg>

  <main id="main"></main>
  <footer id="foot"></footer>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const win = window.__TAURI__.window.getCurrentWindow();

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const paths = [...stage.querySelectorAll("path")];
  const rising = stage.querySelector(".in");
  const head = $("head");
  const lens = paths.map((p) => p.getTotalLength());

  let info = null;
  let opts = { dir: "", desktop: true, wipe: false };
  let busy = false;
  let primary = null;

  // ------------------------------------------------------------ curvas
  function draw(f) {
    paths.forEach((p, i) => {
      p.style.strokeDasharray = lens[i];
      p.style.strokeDashoffset = lens[i] * (1 - f);
    });
    const pt = rising.getPointAtLength(lens[1] * Math.max(0, Math.min(1, f)));
    head.setAttribute("cx", pt.x);
    head.setAttribute("cy", pt.y);
  }

  // Parado: um ponto passeia pela curva que sobe, como uma música tocando.
  let idle = null;
  function play() {
    stop();
    stage.classList.add("playing");
    const t0 = performance.now();
    const tick = (t) => {
      const k = ((t - t0) / 5200) % 1;
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const pt = rising.getPointAtLength(lens[1] * e);
      head.setAttribute("cx", pt.x);
      head.setAttribute("cy", pt.y);
      idle = requestAnimationFrame(tick);
    };
    idle = requestAnimationFrame(tick);
  }
  function stop() {
    if (idle) cancelAnimationFrame(idle);
    idle = null;
    stage.classList.remove("playing");
  }

  // ------------------------------------------------------------ montagem das telas
  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "on") n.addEventListener("click", v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
    return n;
  }
  const btn = (text, on, cls = "btn") => el("button", { class: cls, on }, text);
  const tick = () => {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", "12"); s.setAttribute("height", "12"); s.setAttribute("viewBox", "0 0 12 12");
    s.innerHTML = '<path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
    return s;
  };
  const check = (text, key) => {
    const input = el("input", { type: "checkbox" });
    input.checked = opts[key];
    input.addEventListener("change", () => (opts[key] = input.checked));
    return el("label", { class: "check" }, input, el("span", { class: "box" }, tick()), text);
  };

  function show(main, left, right) {
    const m = $("main");
    m.replaceChildren(...main);
    m.style.animation = "none";
    void m.offsetWidth;
    m.style.animation = "";
    $("foot").replaceChildren(left || el("span"), el("div", { class: "right" }, right || []));
    primary = right ? [right].flat().find((b) => b.classList?.contains("primary")) : null;
  }

  const verb = () => (!info || info.installed == null ? "Instalar" : info.installed === info.version ? "Reinstalar" : "Atualizar");

  function welcome() {
    play();
    const v = verb();
    const sub =
      v === "Atualizar"
        ? `Você tem ${info.installed ? "a versão " + info.installed : "uma versão anterior"} e esta é a ${info.version}. Playlists, curtidas e preferências continuam como estão.`
        : "Player de música para quem tem a própria biblioteca. FLAC e hi-res tocados do jeito que foram gravados.";
    const meta = info.running
      ? el("p", { class: "meta warn" }, "O Toxify está aberto e vai fechar sozinho durante a instalação.")
      : el("p", { class: "meta" }, `Versão ${info.version} · Instala só para você, sem senha de administrador.`);
    show(
      [el("h1", {}, `${v} o Toxify`), el("p", { class: "sub" }, sub), meta],
      btn("Opções de instalação", options, "link"),
      btn(v, () => run(), "btn primary"),
    );
  }

  function options() {
    const path = el("div", { class: "path", title: opts.dir }, opts.dir);
    const change = btn("Alterar", async () => {
      const dir = await invoke("pick_dir", { current: opts.dir });
      if (dir) {
        opts.dir = dir;
        path.textContent = dir;
        path.title = dir;
      }
    }, "btn small");
    show(
      [
        el("h1", {}, "Opções de instalação"),
        el("label", { class: "title" }, "Pasta"),
        el("div", { class: "path-row" }, path, change),
        check("Criar atalho na Área de Trabalho", "desktop"),
      ],
      btn("Voltar", welcome, "link"),
      btn(verb(), () => run(), "btn primary"),
    );
  }

  function uninstallAsk() {
    play();
    show(
      [
        el("h1", {}, "Desinstalar o Toxify"),
        el("p", { class: "sub" }, "O programa sai deste computador. Suas músicas continuam exatamente onde estão."),
        check("Apagar também playlists, curtidas e preferências", "wipe"),
      ],
      el("span"),
      [btn("Cancelar", () => win.close()), btn("Desinstalar", () => run(), "btn primary")],
    );
  }

  // ------------------------------------------------------------ instalar / desinstalar
  async function run() {
    const un = info.uninstall;
    const v = verb();
    busy = true;
    $("close").disabled = true;
    stop();
    stage.classList.add("live");

    const label = el("p", { class: "sub" }, "Preparando");
    const pct = el("span", { class: "pct" }, "0%");
    show([el("h1", {}, un ? "Desinstalando o Toxify" : v === "Atualizar" ? "Atualizando o Toxify" : "Instalando o Toxify"), label], null, pct);

    // O trabalho de verdade leva menos de um segundo; a barra anda no ritmo dela pra dar pra ler.
    let target = 0, shown = 0, finished = false;
    const off = await listen("step", (e) => {
      target = e.payload.pct;
      label.textContent = e.payload.label;
    });
    const anim = new Promise((resolve) => {
      const frame = () => {
        shown = Math.min(target, shown + Math.max(0.004, (target - shown) * 0.08), shown + 1 / 80);
        draw(un ? 1 - shown : shown);
        pct.textContent = Math.round(shown * 100) + "%";
        if (finished && shown >= 0.999) return resolve();
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    });

    try {
      if (un) await invoke("run_uninstall", { wipe: opts.wipe });
      else await invoke("run_install", { dir: opts.dir, desktop: opts.desktop });
      target = 1;
      finished = true;
      await anim;
      off();
      done(un, v);
    } catch (e) {
      off();
      finished = true;
      target = shown;
      failed(String(e), un);
    } finally {
      busy = false;
      $("close").disabled = false;
      stage.classList.remove("live");
    }
  }

  function done(un, v) {
    if (un) {
      draw(0);
      show(
        [el("h1", {}, "O Toxify foi desinstalado"), el("p", { class: "sub" }, opts.wipe ? "O programa e os dados dele saíram deste computador. Suas músicas ficaram onde estavam." : "O programa saiu deste computador. Suas playlists e preferências ficaram guardadas, caso você volte.")],
        el("span"),
        btn("Fechar", () => win.close(), "btn primary"),
      );
      return;
    }
    draw(1);
    play();
    show(
      [
        el("h1", {}, v === "Atualizar" ? "O Toxify foi atualizado" : "O Toxify está instalado"),
        el("p", { class: "sub" }, opts.desktop ? "Ele já está no menu Iniciar e na Área de Trabalho." : "Ele já está no menu Iniciar."),
      ],
      btn("Fechar", () => win.close(), "link"),
      btn("Abrir o Toxify", async () => {
        try {
          await invoke("open_toxify", { dir: opts.dir });
        } catch (e) {
          failed(String(e), false);
        }
      }, "btn primary"),
    );
  }

  function failed(msg, un) {
    stop();
    show(
      [el("h1", {}, un ? "Não foi possível desinstalar" : "Não foi possível instalar"), el("p", { class: "sub err" }, msg)],
      btn("Fechar", () => win.close(), "link"),
      btn("Tentar de novo", () => run(), "btn primary"),
    );
  }

  // ------------------------------------------------------------ início
  $("min").addEventListener("click", () => win.minimize());
  $("close").addEventListener("click", () => !busy && win.close());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !busy) win.close();
    if (e.key === "Enter" && primary && document.activeElement?.tagName !== "BUTTON") primary.click();
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  (async () => {
    draw(0);
    info = await invoke("info");
    opts.dir = info.dir;
    requestAnimationFrame(() => draw(1));
    if (info.uninstall) uninstallAsk();
    else welcome();
  })();
</script>
</body>
</html>
