# Gera o Toxify-Setup.exe numa máquina do GitHub, a partir do código deste repositório, e publica a
# versão com o atestado de origem (quem baixa confere com `gh attestation verify`).
# Rodar: Actions > Release > Run workflow (a versão vem do package.json).
# As actions ficam presas por SHA: o atestado só vale se nada de fora mudar o build sem a gente ver.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (Markdown)"
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Toxify-Setup.exe

      # Opcional: com o segredo VT_API_KEY (conta grátis no virustotal.com), manda o instalador pra análise.
      # A chave fica só neste passo, longe do npm ci e do build.
      - name: VirusTotal
        id: vt
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          [ -z "$VT_API_KEY" ] && exit 0
          curl -sf -X POST https://www.virustotal.com/api/v3/files -H "x-apikey: $VT_API_KEY" -F file=@release/Toxify-Setup.exe > /dev/null
          echo "sent=1" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VT_SENT: ${{ steps.vt.outputs.sent }}
        run: |
          v=$(node -p "require('./package.json').version")
          sha=$(sha256sum release/Toxify-Setup.exe | cut -d' ' -f1)
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            echo "### Download"
            echo "**Toxify-Setup.exe**, Windows 10/11 64-bit. Installs per user, no admin password."
            echo
            echo "### Verify"
            echo "Built on GitHub Actions from this repository's source ([build log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)), with a signed build provenance attestation:"
            echo
            echo '```sh'
            echo "gh attestation verify Toxify-Setup.exe --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "SHA-256: \`$sha\`"
            if [ -n "$VT_SENT" ]; then echo; echo "VirusTotal: https://www.virustotal.com/gui/file/$sha"; fi
          } > notes.md
          gh release create "v$v" release/Toxify-Setup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Toxify $v" --notes-file notes.md
